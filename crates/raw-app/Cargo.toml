[package]
name = "raw-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# egui shell. At milestone 1 this is one window, one image, two sliders.

# **The executable is `monopro`, and that is not cosmetic.** macOS takes the application
# menu's title from the running process, so a binary called `raw-app` put "Raw App" at
# the top left of the screen whatever `Menus::install` was passed. The crate keeps its
# name; only the artefact is renamed.
[[bin]]
name = "monopro"
path = "src/main.rs"

[dependencies]
raw-core.workspace = true
raw-gpu.workspace = true
eframe.workspace = true      # default features select the wgpu backend, not glow
egui.workspace = true
egui_tiles.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
pollster.workspace = true
png = "0.18.1"
reflink-copy.workspace = true
serde.workspace = true
toml.workspace = true
rfd = "0.17.2"
rayon.workspace = true
tiff = "0.11.3"
resvg = { version = "0.47", default-features = false }
jpeg-encoder = "0.7.1"
# Reading cached Lightbox tiles back, and nothing else. `jpeg-encoder` above writes
# them; this is the other half. **`default-features = false` with only `jpeg`**: the
# full crate brings a decoder for every format it supports, which is a large decode
# surface to acquire for reading files this app wrote itself.
# Reading cached Lightbox tiles back, and thumbnailing the ordinary image formats
# the grid now lists. `default-features = false` still: this is the set the browser
# can actually show, chosen rather than inherited.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "bmp", "gif"] }
pdf-writer = "0.15.0"
ttf-parser = "0.25.1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# The native menu bar. Its Linux defaults are GTK and libxdo, but non-macOS builds
# deliberately keep their shortcuts in egui until a native shell can attach a menu.
muda = { version = "0.19", default-features = false }
# Sparkle auto-updates, stable channel. Chosen over slint-ui/sparklers because it
# registers as the user-driver delegate too: `GentleReminders` is what keeps a
# scheduled update silent (the badge is ours, not Sparkle's alert) and
# `RelaunchHandler` is what defers a relaunch until an export has drained.
# hankbao/sparkle-updater was rejected — abandoned since 2023 on Sparkle 1.x.
# The framework itself is vendored and pinned in packaging/macos/Sparkle; see
# `.cargo/config.toml` for how the build finds it.
sparkle-updater = "0.1.0"
# Direct so `updater.rs` can write Sparkle's own `SUSkippedVersion` user default,
# keeping our skip choice and Sparkle's skip machinery in agreement.
objc2-foundation = { version = "0.3", features = ["NSUserDefaults"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# For the updater's private-API canary only: `objc2-foundation` re-exports
# `NSObject` and `MainThreadMarker`, not `runtime::AnyClass`, which is what
# asking the ObjC runtime whether a class still answers a selector needs.
objc2 = "0.6"
