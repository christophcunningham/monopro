name: Native CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 / arm64
            runner: macos-15
          - name: Windows Server 2025 / x64
            runner: windows-2025
          - name: Ubuntu 24.04 / x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy --no-self-update
          rustup default 1.92.0

      - name: Compile and lint every target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run platform and application tests
        run: cargo test --locked -p raw-core -p raw-graph -p raw-app

      # The integration suite needs a real Metal/DX12/Vulkan adapter. Its sources are
      # compiled by clippy above; the pure planning/layout tests still run here.
      - name: Run GPU tests that do not require a display adapter
        run: cargo test --locked -p raw-gpu --lib
