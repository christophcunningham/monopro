name: Native CI

on:
  pull_request:
  push:
  workflow_dispatch:
  # Weekly, for the advisories job alone: a new RustSec advisory can land against a
  # lockfile that has not changed, and nothing else would run to notice it.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Pinned to the commit behind v2.1.1, not the tag: this job exists as
      # supply-chain insurance, so the tool doing the checking is not a moving tag.
      # Policy is in deny.toml.
      - name: Check Cargo.lock against the RustSec advisory database
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked
          command: check
          command-arguments: advisories

  test:
    name: ${{ matrix.name }}
    # The weekly schedule is for advisories; the build matrix gains nothing from it.
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 15 / arm64
            runner: macos-15
          - name: Windows Server 2025 / x64
            runner: windows-2025
          - name: Ubuntu 24.04 / x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Check out the source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the minimum Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy --no-self-update
          rustup default 1.92.0

      - name: Compile and lint every target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run platform and application tests
        run: cargo test --locked -p raw-core -p raw-graph -p raw-app

      # The integration suite needs a real Metal/DX12/Vulkan adapter. Its sources are
      # compiled by clippy above; the pure planning/layout tests still run here.
      - name: Run GPU tests that do not require a display adapter
        run: cargo test --locked -p raw-gpu --lib
